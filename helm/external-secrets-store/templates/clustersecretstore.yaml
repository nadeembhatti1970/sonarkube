# ---------------------------------------------------------------------------
# ClusterSecretStore for AWS Secrets Manager.
#
# No auth block: the External Secrets Operator authenticates with EKS Pod
# Identity (the controller service account is bound to an IAM role by
# core-external-secrets). AWS credentials are never stored in Kubernetes.
# ---------------------------------------------------------------------------
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ required "name is required" .Values.name }}
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/component: secret-store
    app.kubernetes.io/part-of: code-quality-platform
    app.kubernetes.io/managed-by: Helm
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ required "region is required" .Values.region | quote }}
