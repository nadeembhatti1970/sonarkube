# ---------------------------------------------------------------------------
# Database credentials.
#
# The secret is a JSON object written by core-rds. `extract` maps every key
# into the target Secret, so the SonarQube chart and the fixer Job see the same
# keys they always have: host, port, database, username, password, sslmode,
# jdbc_url.
#
# deletionPolicy Retain keeps the Kubernetes Secret if this ExternalSecret is
# removed, so a bad rollout cannot pull credentials out from under a running
# SonarQube pod.
# ---------------------------------------------------------------------------
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.database.targetName }}
  namespace: {{ required "namespace is required" .Values.namespace }}
  labels:
    app.kubernetes.io/name: sonarqube
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: code-quality-platform
    app.kubernetes.io/managed-by: Helm
spec:
  refreshInterval: {{ required "refreshInterval is required" .Values.refreshInterval | quote }}
  secretStoreRef:
    name: {{ required "storeName is required" .Values.storeName }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.database.targetName }}
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: {{ required "database.secretName is required" .Values.database.secretName | quote }}
