# ---------------------------------------------------------------------------
# Administrator credentials and server-side encryption key.
#
# Four scalar secrets are composed into one Kubernetes Secret so the chart's
# setAdminPassword, monitoringPasscode and sonarSecretKey settings can keep
# referencing a single object.
# ---------------------------------------------------------------------------
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.admin.targetName }}
  namespace: {{ required "namespace is required" .Values.namespace }}
  labels:
    app.kubernetes.io/name: sonarqube
    app.kubernetes.io/component: admin
    app.kubernetes.io/part-of: code-quality-platform
    app.kubernetes.io/managed-by: Helm
spec:
  refreshInterval: {{ required "refreshInterval is required" .Values.refreshInterval | quote }}
  secretStoreRef:
    name: {{ required "storeName is required" .Values.storeName }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.admin.targetName }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: password
      remoteRef:
        key: {{ required "admin.passwordSecretName is required" .Values.admin.passwordSecretName | quote }}
    - secretKey: currentPassword
      remoteRef:
        key: {{ required "admin.currentPasswordSecretName is required" .Values.admin.currentPasswordSecretName | quote }}
    - secretKey: passcode
      remoteRef:
        key: {{ required "admin.monitoringPasscodeSecretName is required" .Values.admin.monitoringPasscodeSecretName | quote }}
    - secretKey: sonar-secret.txt
      remoteRef:
        key: {{ required "admin.serverSecretKeySecretName is required" .Values.admin.serverSecretKeySecretName | quote }}
